[package]
name = "sqldr"
version = "1.1.0"
edition = "2021"

[dependencies]
sqldr-core = { path = "../sqldr-core" }
tokio.workspace = true
anyhow.workspace = true
serde.workspace = true
tokio-util.workspace = true
toml = "0.8"
directories = "5"
futures.workspace = true
rpassword = "7"
keyring = { version = "3", features = ["sync-secret-service", "linux-native", "crypto-rust"] }
clap = { version = "4", features = ["derive"] }
url = "2"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tui-textarea = "0.7"
base64 = "0.22"
serde_json = "1"
shell-words = "1"

[dev-dependencies]
parking_lot = "0.12"
